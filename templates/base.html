<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Last Resort Hotels{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <div class="logo"><a href="{{ url_for('home') }}">Last Resort Hotels</a></div>
        <nav>
            <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}class="active"{% endif %}>Reservations</a>
            <a href="{{ url_for('billing') }}" {% if request.endpoint == 'billing' %}class="active"{% endif %}>Billing</a>
            <a href="{{ url_for('events') }}" {% if request.endpoint == 'events' %}class="active"{% endif %}>Events</a>
        </nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer><p>&copy; 2026 Last Resort Hotels</p></footer>
</body>
</html>
